    <style>

        .hero {

        }
        .title-section { flex: 1; }
        .title-section h1 {
            font-size: 2.2rem; font-weight: 700; letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1e2b3c, #2c4a6e);
            background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 0.4rem;
        }
        .custom-sign {
            font-size: 1.25rem; font-weight: 700;
            font-family: '楷体', KaiTi, STKaiti, '华文楷体', 'Microsoft YaHei', serif;
            background: linear-gradient(135deg, #d4a017, #b8860b);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            display: inline-block; padding: 0.2rem 0.8rem; border-radius: 30px;
            letter-spacing: 0.5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            border: 1px solid rgba(212, 160, 23, 0.3); background-color: #fff9e6;
        }
        .hero-badge {
            background: #ffffffcc; backdrop-filter: blur(4px); padding: 0.4rem 1rem; border-radius: 40px;
            font-size: 0.75rem; font-weight: 600; color: #2c5a7a; border: 1px solid #dce5ef;
            white-space: nowrap; display: flex; align-items: center; gap: 0.5rem;
        }
        .hero-badge select {
            border: 1px solid #dce5ef; border-radius: 20px; padding: 0.2rem 0.8rem;
            font-size: 0.8rem; background: white; color: #1f3b4c; outline: none; cursor: pointer; font-weight: 600;
        }
        .workspace { display: grid; grid-template-columns: 380px 1fr; gap: 1.8rem; align-items: start; }
        .input-card {
            background: #ffffff; border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02), 0 0 0 1px #eef2f8; overflow: hidden;
        }
        .card-header { padding: 1.2rem 1.5rem 0.6rem; border-bottom: 1px solid #edf2f7; }
        .card-header h2 { font-size: 1.25rem; font-weight: 600; color: #0f2b3d; }
        .card-body { padding: 1.3rem 1.5rem 1.8rem; }
        .file-area { margin-bottom: 1.4rem; }
        label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; color: #54708f; margin-bottom: 0.5rem; }
        input[type="file"] {
            width: 100%; padding: 0.7rem 0.8rem; border: 1px solid #dce5ef; border-radius: 18px;
            background: #fefefe; font-size: 0.85rem; color: #1e2f3f; cursor: pointer;
        }
        textarea {
            width: 100%; min-height: 260px; border: 1px solid #e2eaf1; border-radius: 20px;
            padding: 0.9rem 1rem; font-size: 0.9rem; line-height: 1.5; font-family: monospace;
            background: #ffffff; resize: vertical; outline: none;
        }
        textarea:focus { border-color: #86a9cf; box-shadow: 0 0 0 3px rgba(100,140,180,0.15); }
        .button-group { display: flex; gap: 0.7rem; margin: 1.2rem 0 1rem; flex-wrap: wrap; }
        button {
            border: none; background: #f0f4f9; padding: 0.6rem 1.2rem; border-radius: 40px;
            font-weight: 600; font-size: 0.85rem; cursor: pointer; color: #1f3b4c;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: #1f3b4c; color: white; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .btn-primary:hover { background: #0f2b3a; }
        .btn-secondary { background: #eef3fa; border: 1px solid #dce5ef; }
        .btn-secondary:hover { background: #e2eaf3; }
        .btn-danger { background: #fff3f0; color: #b13e3e; border: 1px solid #ffe0db; }
        .btn-danger:hover { background: #ffe4df; }
        .btn-accent { background: #e8f5e9; border: 1px solid #c8e6c9; color: #2e7d32; }
        .btn-accent:hover { background: #c8e6c9; border-color: #a5d6a7; }
        .settings-row {
            display: flex; gap: 1rem; margin-top: 1.4rem; padding-top: 1.2rem;
            border-top: 1px solid #eef2f8; flex-wrap: wrap;
        }
        .setting-item { flex: 1; min-width: 100px; }
        .setting-item label { font-size: 0.7rem; margin-bottom: 0.3rem; }
        select, .setting-item input {
            width: 100%; padding: 0.5rem 0.6rem; border-radius: 16px;
            border: 1px solid #d4e0ea; background: white; font-size: 0.85rem; outline: none;
        }
        .display-card {
            background: #ffffff; border-radius: 28px;
            box-shadow: 0 8px 26px rgba(0,0,0,0.03), 0 0 0 1px #eef2f8;
            display: flex; flex-direction: column; overflow: hidden; min-height: 70vh;
        }
        .display-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.5rem; border-bottom: 1px solid #ecf3f9; flex-wrap: wrap; gap: 12px; background: #fefefe;
        }
        .stats { font-size: 0.8rem; font-weight: 600; background: #f0f6fe; padding: 0.3rem 0.9rem; border-radius: 30px; color: #2c6280; }
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .word-board { flex: 1; padding: 1.8rem; background: #fdfdfd; }
        .word-grid { display: grid; gap: 1rem; align-content: start; }
        .word-grid.auto { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
        .word-grid.one { grid-template-columns: 1fr; }
        .word-grid.two { grid-template-columns: repeat(2, 1fr); }
        .word-grid.three { grid-template-columns: repeat(3, 1fr); }
        .word-grid.four { grid-template-columns: repeat(4, 1fr); }
        .word-card {
            display: flex; align-items: baseline; gap: 0.7rem; background: #ffffff;
            border: 1px solid #e9f0f5; border-radius: 20px; padding: 0.9rem 1.2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .word-card:hover { border-color: #cbdde9; }
        .number { font-size: var(--number-size, 26px); font-weight: 700; color: #7f9bbb; min-width: 3.2rem; }
        .word { font-size: var(--word-size, 32px); font-weight: 700; line-height: 1.2; color: #1f2f3e; word-break: break-word; }
        .empty {
            text-align: center; padding: 3rem 2rem; color: #9bb1c2; font-weight: 500;
            background: #fafdff; border-radius: 24px; border: 1px dashed #dce7f0;
        }
        .status-message, .error-message { font-size: 0.75rem; margin-top: 0.8rem; font-weight: 500; }
        .status-message { color: #2c7a4d; }
        .error-message { color: #c2412c; }

        /* ================= 全屏投屏版 ================= */
        body.fullscreen-mode {
            background: #ffffff; overflow: hidden;
        }
        body.fullscreen-mode::before { opacity: 0.04; }
        body.fullscreen-mode .app { max-width: none; padding: 0; }
        body.fullscreen-mode .hero,
        body.fullscreen-mode .input-card { display: none; }
        body.fullscreen-mode .workspace { display: block; }
        body.fullscreen-mode .display-card { min-height: 100vh; border-radius: 0; box-shadow: none; background: #ffffff; }
        body.fullscreen-mode .display-bar {
            position: fixed; right: 10px; top: 8px; z-index: 50; padding: 4px 8px;
            border: 1px solid rgba(0,0,0,0.08); border-radius: 999px;
            background: rgba(255,255,255,0.76); backdrop-filter: blur(4px); opacity: 0.14; transition: opacity 0.2s ease;
        }
        body.fullscreen-mode .display-bar:hover { opacity: 1; }
        body.fullscreen-mode .display-bar .stats { display: none; }
        body.fullscreen-mode .display-bar button { padding: 4px 8px; font-size: 12px; border-radius: 999px; background: rgba(240,240,240,0.9); color: #111; }
        body.fullscreen-mode .word-board { width: 100vw; height: 100vh; min-height: 100vh; overflow-y: auto; padding: 8px 2px 14px; background: #ffffff; }
        body.fullscreen-mode .word-grid.fullscreen-grid { width: 100%; display: grid; grid-auto-flow: row; column-gap: 0; row-gap: 0; align-content: start; }
        body.fullscreen-mode .word-grid.fullscreen-unit { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: calc((100vh - 22px) / 16); }
        body.fullscreen-mode .word-grid.fullscreen-column { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: calc((100vh - 22px) / 6); }
        body.fullscreen-mode .word-card {
            grid-column: span var(--span, 1); min-width: 0; height: 100%;
            display: flex; align-items: flex-end; justify-content: flex-start; gap: 0;
            padding: 0 2px 3px; border: none; border-bottom: 1.2px dotted #111;
            border-radius: 0; background: transparent; box-shadow: none; overflow: hidden;
        }
        body.fullscreen-mode .number,
        body.fullscreen-mode .word {
            font-family: "Times New Roman", Times, "Nimbus Roman No9 L", serif;
            font-size: var(--word-size); font-weight: 400; line-height: 1; color: #000000;
            letter-spacing: -0.8px; white-space: nowrap; overflow: visible; text-overflow: clip; word-break: normal;
        }
        body.fullscreen-mode .number { min-width: auto; flex: 0 0 auto; color: #000000; margin-right: 0; }
        body.fullscreen-mode .word { flex: 0 1 auto; }
        body.fullscreen-mode .empty {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            border: none; background: #fff; color: #888; font-size: 30px; font-family: "Times New Roman", Times, serif;
        }

        @media (max-width: 820px) {
            .workspace { grid-template-columns: 1fr; }
            .app { padding: 1.5rem; }
            .word-grid.two, .word-grid.three, .word-grid.four { grid-template-columns: 1fr; }
        }
        @media print {
            body { background: white; }
            .hero, .input-card, .display-bar { display: none; }
            .display-card { box-shadow: none; border: none; }
            .word-card { border: 1px solid #ccc; }
        }

        #login-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background: #fff; padding: 40px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px;
        }
        .login-box h2 { margin-top: 0; color: #333; font-size: 24px; }
        .login-box input {
            width: 100%; padding: 10px; margin: 10px 0;
            border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;
        }
        .login-box button {
            width: 100%; padding: 12px; background-color: #0066cc; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px;
        }
        .login-box button:hover { background-color: #0052a3; }
        #error-msg { color: red; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
<div id="login-wrapper">

</div>

        <textarea id="wordInput" spellcheck="false" placeholder="1. apple
2. take off
3. beautiful

        <div class="button-group">
          <button class="btn-primary" id="shuffleBtn">🎲 生成乱序</button>

    <section class="display-card" id="displayPanel">

          <button class="btn-secondary" id="printBtn">🖨️ 打印</button>
          <button class="btn-secondary" id="fullscreenBtn">🖥️ 全屏</button>
        </div>
      </div>
      <div class="word-board" id="wordBoard">
        <div class="empty">✨ 请导入单词或粘贴列表，点击「生成乱序」<br>保留原始序号，单词随机排序</div>
      </div>
    </section>
  </div>
</main>

  function normalizeLine(line) { return String(line || '').replace(/^\uFEFF/, '').trim(); }
  function cleanCell(value) { return (value === undefined || value === null) ? '' : String(value).replace(/\s+/g, ' ').trim(); }
  function looksLikeHeader(row) {
    const joined = row.map(cleanCell).join('').toLowerCase();
    if (!joined) return true;
    return /^(序号|编号|no\.?|number|单词|词汇|word|phrase|短语)+$/i.test(joined.replace(/[\s_\-:：]/g, ''));
  }
  function makeAutoNumber(index) { return String(index + 1) + '.'; }

  function parseLine(line, fallbackIndex) {
    const trimmed = normalizeLine(line);
    if (!trimmed) return null;
    const patterns = [
      /^((?:\d+|[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑰⑱⑲⑳]|[一二三四五六七八九十]+|[A-Za-z])\s*[\.、\)）:：-]\s*)(.+)$/,
      /^((?:Unit|Lesson|Module|U|L)\s*\d+(?:\s*[-–—.]\s*\d+)?\s*[\.、\)）:：-]?\s+)(.+)$/i,
      /^((?:\d+\s*[-–—.]\s*\d+)\s*[\.、\)）:：-]?\s+)(.+)$/
    ];
    for (const pattern of patterns) {
      const match = trimmed.match(pattern);
      if (match && cleanCell(match[2])) {
        return { number: match[1].trim(), word: match[2].trim() };
      }
    }
    return { number: makeAutoNumber(fallbackIndex), word: trimmed };
  }

  function parseTextInput(text) {
    const lines = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

  }

  function parseRowsToItems(rows) {
    const items = [];
    for (let row of rows) {
      const cells = Array.isArray(row) ? row.map(cleanCell).filter(Boolean) : [];
      if (!cells.length) continue;
      if (items.length === 0 && looksLikeHeader(cells)) continue;
      if (cells.length >= 2) {
        const first = cells[0];
        const rest = cells.slice(1).join(' ').trim();
        if (first && rest) { items.push({ number: first, word: rest }); continue; }
      }
      const parsed = parseLine(cells.join(' '), items.length);
      if (parsed) items.push(parsed);
    }
    return items;
  }

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {

      [copy[i], copy[j]] = [copy[j], copy[i]];

  function estimateWordSpan(word, cfg) {
    const boardWidth = wordBoard && wordBoard.clientWidth
      ? wordBoard.clientWidth
      : window.innerWidth;
    const safeBoardWidth = Math.max(320, boardWidth - 8);
    const cellWidth = safeBoardWidth / cfg.cols;
    const text = '88' + String(word || '');
    let textWidth = 0;
    try {
      const canvas = estimateWordSpan._canvas || (estimateWordSpan._canvas = document.createElement('canvas'));
      const ctx = canvas.getContext('2d');
      ctx.font = cfg.fontSize + 'px "Times New Roman", Times, serif';
      textWidth = ctx.measureText(text).width;
    } catch (e) {
      textWidth = text.length * cfg.fontSize * 0.52;
    }
    const allowedWidth = cellWidth * 0.92;
    const span = Math.ceil(textWidth / allowedWidth);
    return Math.max(1, Math.min(cfg.cols, span));
  }
  
  function packWordsForGrid(words, cfg, randomize) {
    let pool = words.map((word, order) => ({
      word,
      order,
      span: estimateWordSpan(word, cfg)
    }));
    if (randomize) {
      pool = shuffleArray(pool);
    }
    const output = [];
    while (pool.length) {
      let remaining = cfg.cols;
      let placedInThisRow = false;
      while (pool.length && remaining > 0) {
        let candidates = pool
          .map((item, index) => ({ item, index }))
          .filter(entry => entry.item.span <= remaining);
        if (remaining === 1) {
          const singleCandidates = candidates.filter(entry => entry.item.span === 1);
          if (singleCandidates.length) {
            candidates = singleCandidates;
          }
        }
        if (!candidates.length) break;
        const chosen = randomize
          ? candidates[Math.floor(Math.random() * candidates.length)]
          : candidates[0];
        output.push(chosen.item.word);
        remaining -= chosen.item.span;
        pool.splice(chosen.index, 1);
        placedInThisRow = true;
      }
      if (!placedInThisRow && pool.length) {
        output.push(pool.shift().word);
      }
    }
    return output;
  }
  
  function aestheticShuffleWords(wordArray) {
    if (!wordArray.length) return [];

        return;

      const validItems = backup.items.filter(item => item && item.word);
      if (validItems.length === 0) {

      }
      const normalizedBackup = {
        version: backup.version || 1,
        items: validItems.map((item, idx) => ({
          number: item.number || makeAutoNumber(idx),
          word: String(item.word).trim()
        })),
        shuffledWords: Array.isArray(backup.shuffledWords) ? [...backup.shuffledWords] : aestheticShuffleWords(validItems.map(i => String(i.word).trim())),
        column: backup.column || 'auto',
        fontSize: typeof backup.fontSize === 'number' ? backup.fontSize : 32
      };
      let setName = String(file.name || 'unknown').replace(/\.json$/i, '').trim();
      if (!setName) setName = '未命名词库';
      const wordCount = normalizedBackup.items.length;
      USER_WORD_SETS[setName] = normalizedBackup;
      updateUserWordSetsGroup();
      const select = document.getElementById('wordSetSelect');
      if (select) {
        select.value = setName;
      }
      restoreFromBackup(normalizedBackup, setName + '（' + wordCount + '词）');
      showStatus('📚 已添加词库「' + setName + '」（' + wordCount + '词）到词库列表，导出嵌入HTML即可永久保存');
    } catch (err) {
      showError('添加词库失败：' + (err.message || '无效的 JSON 文件'));
    }
  }

  if (wordSetSelect) {
    wordSetSelect.addEventListener('change', function() {
      loadWordSet(this.value);
    });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportBackupJSON() {
    if (!parsedItems.length) { showError('没有单词数据可导出'); return; }
    const backup = buildBackupObject();
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    downloadBlob(blob, 'system_backup.json');
    showStatus('✅ 备份文件 system_backup.json 已下载');
  }

  async function importJSONFile(file) {
    try {
      const text = await readAsText(file);
      const backup = JSON.parse(text);
      restoreFromBackup(backup, file.name);
    } catch (err) {
      showError('导入失败：' + (err.message || '无效的 JSON 文件'));
    }
  }

  function exportEmbeddedHTML() {
    if (!parsedItems.length) { showError('没有单词数据可嵌入'); return; }
    const clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('script').forEach(script => {
      if (script.type === 'text/plain') return;
      if (script.id === 'bootScript') return;
      if (script.hasAttribute('data-embed-backup')) script.remove();
      if (script.hasAttribute('data-embed-user-word-sets')) script.remove();
    });
    const backup = buildBackupObject();
    const backupJSON = JSON.stringify(backup);
    const embedScript = document.createElement('script');
    embedScript.setAttribute('data-embed-backup', '');
    embedScript.textContent = 'window.__EMBEDDED_BACKUP__ = ' + backupJSON + ';';
    const userWordSetsScript = document.createElement('script');
    userWordSetsScript.setAttribute('data-embed-user-word-sets', '');
    userWordSetsScript.textContent = 'window.__EMBEDDED_USER_WORD_SETS__ = ' + JSON.stringify(USER_WORD_SETS) + ';';
    const bootScript = clone.querySelector('#bootScript');
    if (bootScript && bootScript.parentNode) {
      bootScript.parentNode.insertBefore(userWordSetsScript, bootScript);
      bootScript.parentNode.insertBefore(embedScript, userWordSetsScript);
    } else {
      const body = clone.querySelector('body');
      if (body) {
        body.appendChild(userWordSetsScript);
        body.appendChild(embedScript);
      } else {
        clone.appendChild(userWordSetsScript);
        clone.appendChild(embedScript);
      }
    }
    let html = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    downloadBlob(blob, '单词乱序工具_嵌入数据.html');
    const userCount = Object.keys(USER_WORD_SETS).length;
    const msg = userCount > 0 ? '📦 已导出嵌入数据的 HTML 文件（含 ' + userCount + ' 个用户词库）' : '📦 已导出嵌入数据的 HTML 文件（数据为当前词库）';
    showStatus(msg);
  }

  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });
  wordInput.addEventListener('input', () => { importedStructuredItems = null; });
  shuffleBtn.addEventListener('click', generateShuffle);
  reshuffleBtn.addEventListener('click', reshuffleCurrent);
  copyBtn.addEventListener('click', copyResult);
  printBtn.addEventListener('click', () => window.print());
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  clearBtn.addEventListener('click', clearAll);
  sampleBtn.addEventListener('click', () => {
    importedStructuredItems = null;
    wordInput.value = sampleText;
    generateShuffle();
  });
  columnSelect.addEventListener('change', renderBoard);
  fontSizeInput.addEventListener('input', renderBoard);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('fullscreen-mode')) toggleFullscreen();
  });

  exportJsonBtn.addEventListener('click', exportBackupJSON);
  importJsonBtn.addEventListener('click', () => { jsonFileInput.click(); });
  jsonFileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      importJSONFile(e.target.files[0]);
      jsonFileInput.value = '';
    }
  });
  exportHtmlBtn.addEventListener('click', exportEmbeddedHTML);
  addWordSetBtn.addEventListener('click', () => { wordSetFileInput.click(); });
  wordSetFileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      addWordSetFromJSON(e.target.files[0]);
      wordSetFileInput.value = '';
    }
  });

  if (EMBEDDED_USER_WORD_SETS && typeof EMBEDDED_USER_WORD_SETS === 'object') {
    USER_WORD_SETS = EMBEDDED_USER_WORD_SETS;
    updateUserWordSetsGroup();
    delete window.__EMBEDDED_USER_WORD_SETS__;
  }

  if (EMBEDDED_BACKUP) {
    try {
      restoreFromBackup(EMBEDDED_BACKUP);
      delete window.__EMBEDDED_BACKUP__;
    } catch (e) {
      console.warn('嵌入数据加载失败', e);
      if (parsedItems.length === 0 && wordInput.value.trim() === '') {
        wordInput.value = sampleText;
        generateShuffle();
      }
    }
  } else {
    if (wordSetSelect && BUILTIN_WORD_SETS) {
      const defaultKey = wordSetSelect.value;
      loadWordSet(defaultKey);
    } else if (parsedItems.length === 0 && wordInput.value.trim() === '') {
      wordInput.value = sampleText;
      generateShuffle();
    }
  }
})();
</script>

<!-- SHA-256 密码验证 -->
<script>
async function verifyLogin() {
    const correctUser = "wzh";
    // !!! 请将下面这行替换为您生成的 SHA-256 哈希值 !!!
    const CORRECT_PASSWORD_HASH = 'dba1fba2907f2de68776a1e80bd1c6dcc93715242eac677c3859844bb04f1deb'; // 替换为 64 位十六进制字符串

    const userVal = document.getElementById("username").value;
    const passVal = document.getElementById("password").value;

    if (userVal !== correctUser) {
        document.getElementById("error-msg").style.display = "block";
        return;
    }

    try {
        const msgBuffer = new TextEncoder().encode(passVal);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        if (hashHex === CORRECT_PASSWORD_HASH) {
            document.getElementById("login-wrapper").style.display = "none";
            document.getElementById("main-app").style.display = "block";
        } else {
            document.getElementById("error-msg").style.display = "block";
        }
    } catch (e) {
        document.getElementById("error-msg").style.display = "block";
        console.error('密码验证失败', e);
    }
}
</script>
